# MarkSync 手动部署 · 单容器双协议版（http + https）
# 与主 docker-compose.yml 的差异：额外映射 HTTPS 端口并启用进程内 TLS
# （应用自身监听 https，无需 nginx 反代容器）。证书默认用宿主机
# fnOS 系统自签证书；其他系统把下面两个证书路径换成自己的 PEM 文件。
# 用法：docker compose -f docker-compose.https.yml up -d
services:
  marksync:
    build:
      context: ..
      dockerfile: Dockerfile
    image: marksync:latest
    container_name: marksync
    restart: always
    ports:
      - "8888:3000"
      - "8443:3443"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Shanghai
      - DB_PATH=/app/backend/data/bookmarks.db
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - REGISTRATION_OPEN=${REGISTRATION_OPEN:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://marksync.zcoolq.cn}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION:-true}
      # 单容器双协议：同时监听 http:3000 与 https:3443
      - HTTPS_PORT=3443
      - TLS_CERT_PATH=/etc/marksync/tls/server.crt
      - TLS_KEY_PATH=/etc/marksync/tls/server.key
    volumes:
      - ../backend/data:/app/backend/data
      - ${TLS_CERT_HOST_PATH:-/usr/trim/nginx/conf/server.crt}:/etc/marksync/tls/server.crt:ro
      - ${TLS_KEY_HOST_PATH:-/usr/trim/nginx/conf/server.key}:/etc/marksync/tls/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(`http://localhost:3000/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
