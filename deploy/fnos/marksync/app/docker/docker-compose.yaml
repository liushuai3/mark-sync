services:
  marksync:
    # 镜像 tag 与 manifest 版本严格对齐（不一致会报 manifest unknown）
    image: zcoolq/marksync:4.0.0
    container_name: marksync-app
    restart: unless-stopped
    ports:
      - "${TRIM_SERVICE_PORT}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Shanghai
      - DB_PATH=/app/backend/data/bookmarks.db
      - JWT_EXPIRES_IN=7d
      - REGISTRATION_OPEN=true
      - LOG_LEVEL=info
      - ADMIN_USERNAME=${wizard_admin_user:-}
      - ADMIN_PASSWORD=${wizard_admin_password:-}
    volumes:
      - "${TRIM_PKGVAR}/data:/app/backend/data"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(`http://localhost:3000/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  marksync-https:
    # HTTPS 反代：复用 fnOS 系统自签证书，监听 ${wizard_https_port:-8443}。
    # 容器名带 -app 后缀，与手动部署的 marksync-https 容器隔离。
    image: nginx:alpine
    container_name: marksync-https-app
    restart: unless-stopped
    depends_on:
      - marksync
    ports:
      - "${wizard_https_port:-8443}:8443"
    volumes:
      - "./nginx-https.conf:/etc/nginx/conf.d/default.conf"
      - "/usr/trim/nginx/conf/server.crt:/etc/nginx/certs/server.crt:ro"
      - "/usr/trim/nginx/conf/server.key:/etc/nginx/certs/server.key:ro"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 --no-check-certificate -O /dev/null https://127.0.0.1:8443/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
