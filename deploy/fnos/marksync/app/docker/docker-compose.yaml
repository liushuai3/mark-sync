services:
  marksync:
    # 镜像 tag 与 manifest 版本严格对齐（不一致会报 manifest unknown）
    image: zcoolq/marksync:4.0.0
    container_name: marksync-app
    restart: unless-stopped
    ports:
      - "${TRIM_SERVICE_PORT}:3000"
      - "${wizard_https_port:-8443}:3443"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Shanghai
      - DB_PATH=/app/backend/data/bookmarks.db
      - JWT_EXPIRES_IN=7d
      - REGISTRATION_OPEN=true
      - LOG_LEVEL=info
      - ADMIN_USERNAME=${wizard_admin_user:-}
      - ADMIN_PASSWORD=${wizard_admin_password:-}
      # 单容器双协议：应用进程内同时监听 http:3000 与 https:3443，
      # 证书复用 fnOS 系统自签证书（只读挂载）
      - HTTPS_PORT=3443
      - TLS_CERT_PATH=/etc/marksync/tls/server.crt
      - TLS_KEY_PATH=/etc/marksync/tls/server.key
    volumes:
      - "${TRIM_PKGVAR}/data:/app/backend/data"
      - "/usr/trim/nginx/conf/server.crt:/etc/marksync/tls/server.crt:ro"
      - "/usr/trim/nginx/conf/server.key:/etc/marksync/tls/server.key:ro"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(`http://localhost:3000/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
