<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>书签同步助手</h2>
      <div class="header-buttons">
        <button id="remoteBookmarkButton" class="icon-button" title="管理台" aria-label="管理台">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </button>
        <button id="helpButton" class="icon-button" title="使用说明" aria-label="使用说明">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
        <button id="settingsButton" class="icon-button" title="设置" aria-label="设置">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94 0 .31.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
    </div>

    <!-- 未配置提示 -->
    <div id="unconfiguredPanel" class="unconfigured" style="display:none;">
      <p>请先配置 API URL 与 Token</p>
      <button id="goSettingsButton">前往设置</button>
    </div>

    <!-- 主界面 -->
    <div id="mainPanel">
      <div class="status-panel">
        <div class="status-row" id="usernameRow">
          <span class="status-label">用户</span>
          <span id="usernameLabel" class="status-value">-</span>
        </div>
        <div class="status-row">
          <span class="status-label">服务状态</span>
          <span id="healthLabel" class="status-value">-</span>
        </div>
        <div class="status-row">
          <span class="status-label">最后同步</span>
          <span id="lastSyncLabel" class="status-value">-</span>
        </div>
        <div class="status-row">
          <span class="status-label">本地书签</span>
          <span id="localCountLabel" class="status-value">-</span>
        </div>
        <div class="status-row">
          <span class="status-label">远程书签</span>
          <span id="remoteCountLabel" class="status-value">-</span>
        </div>
        <div class="status-row" id="conflictsRow" style="display:none;">
          <span class="status-label">⚠️ 冲突</span>
          <span id="conflictsLabel" class="status-value warning">0</span>
        </div>
      </div>

      <div class="button-group">
        <button id="syncNowBtn">立即同步</button>
        <button id="dedupBtn" title="删除本地重复书签（同文件夹同名同网址），删除会同步到所有设备">清理重复</button>
      </div>

      <div id="toast" class="toast"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
